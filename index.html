<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodyCam — Blockout</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: Consolas, 'Courier New', monospace;
        color: #e8e8e0;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 1);
        letter-spacing: 0.04em;
      }
      /* Bodycam-Overlay */
      #rec {
        position: absolute;
        top: 5vh;
        left: 7vw;
        font-size: 15px;
        line-height: 1.5;
        opacity: 0.85;
      }
      #rec .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 50%;
        background: #e3242b;
        box-shadow: 0 0 6px #e3242b;
        animation: blink 1.2s steps(1) infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      #unit {
        position: absolute;
        bottom: 5vh;
        right: 7vw;
        font-size: 13px;
        text-align: right;
        line-height: 1.5;
        opacity: 0.75;
      }
      #battery {
        display: inline-block;
        width: 26px;
        height: 11px;
        border: 1px solid currentColor;
        margin-left: 6px;
        vertical-align: -1px;
        position: relative;
      }
      #battery::before {
        content: '';
        position: absolute;
        inset: 1px 7px 1px 1px;
        background: currentColor;
      }
      /* Debug-Info (H blendet aus) */
      #info {
        position: absolute;
        bottom: 5vh;
        left: 7vw;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.6;
      }
      #stats {
        position: absolute;
        top: 5vh;
        right: 7vw;
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
        opacity: 0.6;
      }
      #prompt {
        position: absolute;
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        font-size: 16px;
        padding: 6px 14px;
        border: 1px solid rgba(63, 196, 255, 0.6);
        background: rgba(6, 16, 21, 0.55);
        color: #9fe2ff;
      }
      #message {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        max-width: 60vw;
        text-align: center;
        font-size: 20px;
        padding: 8px 18px;
        background: rgba(0, 0, 0, 0.45);
        border-left: 3px solid #e3242b;
      }
      .hidden {
        display: none;
      }
      #blocker {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eee;
        font-family: Consolas, 'Courier New', monospace;
        text-align: center;
        cursor: pointer;
      }
      #blocker.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="rec"><span class="dot"></span>REC<br /><span id="rec-time"></span></div>
      <div id="unit">UNIT 07 · CAM 2<span id="battery"></span><br />SN 4471-0932</div>
      <div id="info"></div>
      <div id="prompt" class="hidden"></div>
      <div id="message" class="hidden"></div>
      <div id="stats"></div>
    </div>
    <div id="blocker">Klicken, um Maussteuerung zu aktivieren</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
